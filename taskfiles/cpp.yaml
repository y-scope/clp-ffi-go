version: "3"

includes:
  deps:
    internal: true
    taskfile: "deps.yaml"
  utils:
    internal: true
    taskfile: "../tools/yscope-dev-utils/exports/taskfiles/utils/utils.yaml"

tasks:
  build-debug:
    cmds:
      - task: "build"
        vars:
          BUILD_TYPE: "debug"

  build-release:
    cmds:
      - task: "build"
        vars:
          BUILD_TYPE: "release"

  clean-debug:
    cmds:
      - task: "clean"
        vars:
          BUILD_TYPE: "debug"

  clean-release:
    cmds:
      - task: "clean"
        vars:
          BUILD_TYPE: "release"

  install-debug:
    requires:
      vars: ["INSTALL_PREFIX"]
    cmds:
      - task: "install"
        vars:
          BUILD_TYPE: "debug"
          INSTALL_PREFIX: "{{.INSTALL_PREFIX}}"

  install-release:
    requires:
      vars: ["INSTALL_PREFIX"]
    cmds:
      - task: "install"
        vars:
          BUILD_TYPE: "release"
          INSTALL_PREFIX: "{{.INSTALL_PREFIX}}"

  build:
    internal: true
    requires:
      vars: ["BUILD_TYPE"]
    deps:
      - "deps:all"
    cmds:
      - task: "utils:cmake:generate"
        vars:
          BUILD_DIR: "{{.G_BUILD_DIR}}/{{.BUILD_TYPE}}"
          EXTRA_ARGS:
            - "-DCMAKE_BUILD_TYPE={{.BUILD_TYPE}}"
            - "-DOS_SUFFIX={{OS}}"
            - "-DARCH_SUFFIX={{ARCH}}"
          SOURCE_DIR: "{{.ROOT_DIR}}/cpp"
      - task: "utils:cmake:build"
        vars:
          BUILD_DIR: "{{.G_BUILD_DIR}}/{{.BUILD_TYPE}}"

  clean:
    internal: true
    requires:
      vars: ["BUILD_TYPE"]
    status:
      - test ! -d "{{.G_BUILD_DIR}}/{{.BUILD_TYPE}}"
    cmds:
      - task: "utils:cmake:clean"
        vars:
          BUILD_DIR: "{{.G_BUILD_DIR}}/{{.BUILD_TYPE}}"

  install:
    internal: true
    requires:
      vars: ["BUILD_TYPE", "INSTALL_PREFIX"]
    deps:
      - "build-{{.BUILD_TYPE}}"
    cmds:
      - task: "utils:cmake:install"
        vars:
          BUILD_DIR: "{{.G_BUILD_DIR}}/{{.BUILD_TYPE}}"
          INSTALL_PREFIX: "{{.INSTALL_PREFIX}}"
