name: "test"

on:
  pull_request:
  push:
  workflow_call:

jobs:
  bazel-test:
    strategy:
      matrix:
        go: ["1.24"]
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: "actions/checkout@v4"

      - run: |
          bazel test //ir:ir_test

  package-test:
    strategy:
      matrix:
        go: ["1.24"]
        os: ["ubuntu-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "actions/setup-go@v5"
        with:
          go-version: "${{ matrix.go }}"

      - name: "Download or build native libraries"
        run: |
          go generate ./...

      - run: |
          go clean -cache
          go test -count=1 ./...

  full-build-test:
    strategy:
      matrix:
        go: ["1.24"]
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: "actions/checkout@v4"
        with:
          submodules: "recursive"

      - uses: "actions/setup-go@v5"
        with:
          go-version: "${{ matrix.go }}"

      - name: "Install build dependencies"
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew update
            brew install cmake gcc task
          else
            sudo sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          fi

      - name: "Build C++ library from source"
        run: |
          task cpp:install-release

      - name: "Generate Go code"
        run: |
          go install golang.org/x/tools/cmd/stringer@latest
          go generate -run stringer ./...

      - run: |
          go clean -cache
          go test -count=1 ./...
